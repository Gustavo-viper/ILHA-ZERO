<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6fd1">
<title>Palavrário — cruzadas do saber</title>
<meta name="description" content="Palavras cruzadas educativas com mais de mil palavras, campanha, desafio diário, missões, loja e conquistas.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef3fb; --bg2: #ffffff; --txt: #1d2a3a; --muted: #66758a; --line: #d6dfeb;
  --pri: #2f6fd1; --pri2: #ffb02e; --ok: #1f9d68; --bad: #e0483e;
  --celbg: #ffffff; --celsel: #ffe58a; --celword: #dbe9ff; --celok: #cdf3e0;
  --fundo: linear-gradient(160deg, #e6efff 0%, #f6efff 55%, #fff4e6 100%);
  --mundo: var(--pri);
  --cel: 38px; --sombra: 0 8px 24px rgba(30, 60, 110, .13); --raio: 18px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; overflow-x: hidden; color: var(--txt); font-family: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { background: var(--fundo) fixed, var(--bg); padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); transition: background .4s; }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1; opacity: .5;
  background-image: radial-gradient(color-mix(in srgb, var(--pri) 18%, transparent) 1.2px, transparent 1.4px); background-size: 26px 26px; }
button { font: inherit; cursor: pointer; color: inherit; }
.hidden { display: none !important; }
.tela { max-width: 1180px; margin: 0 auto; padding: 10px 12px 96px; animation: aparece .25s ease-out; }
@keyframes aparece { from { opacity: 0; transform: translateY(8px); } }

/* ---------- topo ---------- */
.topo { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: color-mix(in srgb, var(--bg2) 88%, transparent); backdrop-filter: blur(10px); border-radius: var(--raio); box-shadow: var(--sombra); margin-bottom: 16px; flex-wrap: wrap; border: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }
.topo .voltar { border: 0; background: var(--bg); border-radius: 12px; padding: 9px 14px; font-weight: 800; box-shadow: 0 3px 0 var(--line); }
.topo h2 { margin: 0; font-size: 20px; flex: 1; min-width: 140px; font-weight: 900; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--bg); padding: 7px 12px; border-radius: 999px; font-weight: 800; font-size: 14px; white-space: nowrap; }
.chip.moedas { background: linear-gradient(135deg, #ffe08a, #ffc44d); color: #4a3200; box-shadow: 0 3px 0 #e0a52a; }
.nivelbox { display: flex; align-items: center; gap: 10px; min-width: 190px; }
.avatar { position: relative; width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(135deg, var(--pri), color-mix(in srgb, var(--pri) 55%, #fff)); display: grid; place-items: center; font-size: 25px; flex: none; box-shadow: 0 4px 0 color-mix(in srgb, var(--pri) 70%, #000); }
.avatar .lv { position: absolute; right: -5px; bottom: -5px; background: var(--pri2); color: #2a1a00; font-size: 11px; font-weight: 900; border-radius: 99px; padding: 1px 6px; border: 2px solid var(--bg2); }
.xpbar { height: 9px; background: var(--line); border-radius: 99px; overflow: hidden; width: 130px; margin-top: 4px; }
.xpbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--pri2), #ff7a59); border-radius: 99px; }

/* ---------- início ---------- */
.hero { text-align: center; padding: 18px 10px 8px; }
.logo { display: inline-grid; gap: 4px; margin: 0 auto 10px; }
.logo .t { width: clamp(30px, 6.5vw, 46px); aspect-ratio: 1; border-radius: 9px; display: grid; place-items: center; font-weight: 900; font-size: clamp(17px, 3.8vw, 26px); color: #fff; background: var(--pri); box-shadow: 0 4px 0 color-mix(in srgb, var(--pri) 65%, #000); animation: cai .5s backwards cubic-bezier(.3, 1.6, .5, 1); }
.logo .t.b { background: var(--pri2); color: #3a2400; box-shadow: 0 4px 0 color-mix(in srgb, var(--pri2) 60%, #000); }
.logo .t.x { background: transparent; box-shadow: none; }
@keyframes cai { from { transform: translateY(-40px) scale(.6); opacity: 0; } }
.hero p { color: var(--muted); margin: 6px 0 0; font-weight: 700; }
.menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; margin-top: 16px; }
.card { background: var(--bg2); border-radius: var(--raio); box-shadow: var(--sombra); padding: 16px; border: 0; text-align: left; position: relative; transition: transform .15s, box-shadow .15s; display: flex; gap: 14px; align-items: center; }
button.card:hover { transform: translateY(-3px); box-shadow: 0 14px 30px rgba(30, 60, 110, .18); }
.card .ic { font-size: 28px; width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; flex: none; background: color-mix(in srgb, var(--cor, var(--pri)) 16%, var(--bg2)); }
.card b { display: block; font-size: 17px; font-weight: 900; }
.card small { color: var(--muted); display: block; margin-top: 2px; line-height: 1.35; font-weight: 600; }
.card.destaque { background: linear-gradient(135deg, var(--pri), color-mix(in srgb, var(--pri) 55%, #8a5cf6)); color: #fff; grid-column: 1 / -1; padding: 20px; }
.card.destaque .ic { background: rgba(255, 255, 255, .2); }
.card.destaque small { color: rgba(255, 255, 255, .85); }
.badge { position: absolute; top: 10px; right: 12px; background: var(--bad); color: #fff; border-radius: 999px; font-size: 12px; font-weight: 900; padding: 2px 8px; animation: pulsa 1.4s infinite; }
@keyframes pulsa { 50% { transform: scale(1.15); } }

/* ---------- mapa ---------- */
.mundos { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.mundo { position: relative; overflow: hidden; color: #fff; border-radius: var(--raio); box-shadow: var(--sombra); padding: 16px; border: 0; text-align: left; background: linear-gradient(145deg, var(--cor), color-mix(in srgb, var(--cor) 60%, #000)); transition: transform .15s; min-height: 140px; }
.mundo:hover { transform: translateY(-3px) rotate(-.4deg); }
.mundo::after { content: attr(data-ic); position: absolute; right: -10px; bottom: -18px; font-size: 90px; opacity: .22; transform: rotate(-12deg); }
.mundo.trancado { filter: grayscale(.85) brightness(.85); opacity: .65; }
.mundo .ic { font-size: 32px; }
.mundo b { display: block; margin-top: 6px; font-size: 17px; font-weight: 900; }
.mundo small { color: rgba(255, 255, 255, .88); font-weight: 700; }
.prog { height: 8px; background: rgba(0, 0, 0, .18); border-radius: 99px; overflow: hidden; margin-top: 10px; }
.prog i { display: block; height: 100%; background: var(--pri2); border-radius: 99px; }
.item .prog { background: var(--line); }
.niveis { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 14px; }
.nivel { aspect-ratio: 1; border-radius: 22px; border: 0; color: #fff; background: linear-gradient(145deg, var(--mundo), color-mix(in srgb, var(--mundo) 60%, #000)); box-shadow: 0 6px 0 color-mix(in srgb, var(--mundo) 55%, #000); display: grid; place-items: center; align-content: center; gap: 4px; font-size: 30px; font-weight: 900; transition: transform .12s; }
.nivel:hover { transform: translateY(-3px); }
.nivel small { font-size: 15px; letter-spacing: 1px; color: #ffd84d; }
.nivel.trancado { filter: grayscale(1); opacity: .45; }

/* ---------- jogo ---------- */
.jogo { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
.painel { background: var(--bg2); border-radius: var(--raio); box-shadow: var(--sombra); padding: 14px; min-width: 0; border-top: 6px solid var(--mundo); }
.barraprog { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 10px; }
.barraprog i { display: block; height: 100%; background: linear-gradient(90deg, var(--ok), #6ee7a8); transition: width .4s; }
.dicaatual { display: flex; align-items: center; gap: 8px; background: color-mix(in srgb, var(--mundo) 14%, var(--bg2)); border-radius: 14px; padding: 10px; margin-bottom: 12px; min-height: 58px; }
.dicaatual .seta { border: 0; background: var(--bg2); border-radius: 10px; width: 36px; height: 36px; font-size: 20px; flex: none; font-weight: 900; box-shadow: 0 3px 0 var(--line); }
.dicaatual .t { flex: 1; font-size: 16.5px; line-height: 1.3; font-weight: 700; }
.dicaatual .t b { color: var(--mundo); }
.gradebox { max-width: 100%; overflow: auto; display: flex; justify-content: center; padding: 4px 4px 8px; }
.grade { display: grid; gap: 3px; user-select: none; touch-action: manipulation; }
.c { width: var(--cel); height: var(--cel); position: relative; border-radius: 7px; background: var(--celbg); box-shadow: inset 0 0 0 1.5px var(--line), 0 3px 0 var(--line); display: grid; place-items: center; font-weight: 900; font-size: calc(var(--cel) * .56); text-transform: uppercase; cursor: pointer; transition: background .15s, transform .1s; }
.c.v { background: transparent; box-shadow: none; cursor: default; }
.c .n { position: absolute; top: 2px; left: 3px; font-size: calc(var(--cel) * .25); font-weight: 800; color: var(--muted); line-height: 1; }
.c.pal { background: var(--celword); }
.c.sel { background: var(--celsel); box-shadow: inset 0 0 0 3px var(--mundo), 0 3px 0 var(--line); transform: translateY(-2px); }
.c.ok { background: var(--celok); color: var(--ok); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--ok) 40%, transparent), 0 3px 0 color-mix(in srgb, var(--ok) 35%, transparent); }
.c.rev { color: #8a4fd6; }
.c.erro { color: var(--bad); animation: tremer .3s; }
.c.pulo { animation: pulo .5s; }
@keyframes pulo { 40% { transform: translateY(-6px) scale(1.12); } }
@keyframes tremer { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.acoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; justify-content: center; }
.btn { border: 0; border-radius: 13px; padding: 10px 15px; font-weight: 800; background: var(--bg); box-shadow: 0 4px 0 var(--line); transition: transform .08s; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.btn.pri { background: var(--pri); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--pri) 60%, #000); }
.btn.amar { background: var(--pri2); color: #2a1a00; box-shadow: 0 4px 0 color-mix(in srgb, var(--pri2) 60%, #000); }
.btn.verde { background: var(--ok); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--ok) 60%, #000); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.listas h3 { margin: 4px 4px 6px; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; font-weight: 900; }
.lista { list-style: none; margin: 0 0 12px; padding: 0; max-height: 34vh; overflow: auto; }
.lista li { padding: 8px 9px; border-radius: 11px; cursor: pointer; font-size: 14.5px; line-height: 1.3; display: flex; gap: 8px; font-weight: 600; }
.lista li b { min-width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: color-mix(in srgb, var(--mundo) 15%, var(--bg2)); color: var(--mundo); font-size: 13px; flex: none; }
.lista li.atual { background: color-mix(in srgb, var(--mundo) 13%, var(--bg2)); }
.lista li.feita { color: var(--muted); text-decoration: line-through; }
.lista li.feita b { background: var(--celok); color: var(--ok); }
.teclado { margin-top: 10px; display: grid; gap: 6px; }
.teclado .linha { display: flex; gap: 5px; justify-content: center; }
.teclado button { flex: 1; max-width: 46px; height: 48px; border: 0; border-radius: 10px; background: var(--bg); font-weight: 900; font-size: 18px; box-shadow: 0 3px 0 var(--line); }
.teclado button:active { transform: translateY(2px); box-shadow: none; }
.teclado button.larga { max-width: 80px; flex: 1.6; }

/* ---------- páginas ---------- */
.item { display: flex; align-items: center; gap: 12px; background: var(--bg2); border-radius: var(--raio); box-shadow: var(--sombra); padding: 12px 14px; margin-bottom: 10px; }
.item .ic { font-size: 30px; width: 52px; height: 52px; border-radius: 15px; display: grid; place-items: center; background: var(--bg); flex: none; }
.item .tx { flex: 1; }
.item .tx b { font-weight: 900; }
.item .tx small { color: var(--muted); display: block; font-weight: 600; }
.item.bloq { opacity: .55; filter: grayscale(.8); }
.item.pronta { box-shadow: 0 0 0 3px var(--pri2), var(--sombra); }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.stat { background: var(--bg2); border-radius: var(--raio); box-shadow: var(--sombra); padding: 16px; }
.stat b { font-size: 28px; display: block; font-weight: 900; color: var(--pri); }
.stat small { color: var(--muted); font-weight: 700; }
.dic h3 { display: flex; justify-content: space-between; margin: 18px 4px 8px; }
.dic .pal { background: var(--bg2); border-radius: 12px; padding: 9px 12px; margin-bottom: 6px; box-shadow: var(--sombra); font-weight: 600; }
.dic .pal b { color: var(--pri); font-weight: 900; }
.busca { width: 100%; padding: 13px 15px; border-radius: 14px; border: 2px solid var(--line); background: var(--bg2); color: var(--txt); font-size: 16px; font-family: inherit; }
.opcao { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px; background: var(--bg2); border-radius: var(--raio); box-shadow: var(--sombra); margin-bottom: 10px; font-weight: 700; }
.opcao select { padding: 8px; border-radius: 10px; font: inherit; background: var(--bg); color: var(--txt); border: 1px solid var(--line); }
.tamanhos, .abas { display: flex; gap: 8px; margin: 10px 0 16px; flex-wrap: wrap; }
.tamanhos .btn.on, .abas .btn.on { background: var(--pri); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--pri) 60%, #000); }

/* ---------- loja ---------- */
.loja { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.produto { background: var(--bg2); border-radius: var(--raio); box-shadow: var(--sombra); padding: 14px; text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.produto.equipado { box-shadow: 0 0 0 3px var(--ok), var(--sombra); }
.produto .vitrine { width: 100%; height: 86px; border-radius: 14px; display: grid; place-items: center; font-size: 44px; }
.produto b { font-weight: 900; }
.produto small { color: var(--muted); font-weight: 600; min-height: 34px; }
.mini { display: grid; grid-template-columns: repeat(4, 18px); gap: 3px; }
.mini i { width: 18px; height: 18px; border-radius: 4px; }


/* ---------- marca ---------- */
.marca { display: flex; align-items: center; gap: 12px; justify-content: center; margin: 4px 0 2px; }
.marca img { width: 64px; height: 64px; filter: drop-shadow(0 6px 10px rgba(40, 60, 140, .25)); animation: cai .6s cubic-bezier(.3, 1.6, .5, 1); }
.marca h1 { margin: 0; font-size: clamp(30px, 7vw, 44px); font-weight: 900; letter-spacing: -.5px; line-height: 1; }
.marca h1 span { color: var(--pri); }
.marca small { display: block; color: var(--muted); font-weight: 800; font-size: 13px; letter-spacing: .3px; margin-top: 3px; }

/* ---------- painel inicial compacto ---------- */
.painelinicio { display: grid; gap: 12px; max-width: 640px; margin: 10px auto 0; }
.jogar { border: 0; border-radius: 24px; padding: 20px; color: #fff; text-align: left; display: flex; align-items: center; gap: 16px; background: linear-gradient(135deg, var(--pri), color-mix(in srgb, var(--pri) 50%, #8a5cf6)); box-shadow: 0 7px 0 color-mix(in srgb, var(--pri) 55%, #000), var(--sombra); transition: transform .1s; }
.jogar:active { transform: translateY(4px); box-shadow: 0 3px 0 color-mix(in srgb, var(--pri) 55%, #000); }
.jogar .play { width: 62px; height: 62px; border-radius: 50%; background: #fff; color: var(--pri); display: grid; place-items: center; font-size: 28px; flex: none; box-shadow: 0 4px 0 rgba(0, 0, 0, .15); }
.jogar b { display: block; font-size: 23px; font-weight: 900; }
.jogar small { color: rgba(255, 255, 255, .88); font-weight: 700; font-size: 14px; }
.atalhos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.atalho { position: relative; border: 0; border-radius: 18px; background: var(--bg2); box-shadow: var(--sombra); padding: 12px 6px; display: grid; justify-items: center; gap: 4px; font-weight: 800; font-size: 13.5px; }
.atalho .ic { font-size: 26px; }
.atalho small { color: var(--muted); font-size: 11.5px; font-weight: 700; }
.resumo { background: var(--bg2); border-radius: 18px; box-shadow: var(--sombra); padding: 12px 14px; display: grid; gap: 6px; font-weight: 800; font-size: 14px; }
.resumo .prog { background: var(--line); margin-top: 0; }

/* ---------- barra de navegação ---------- */
.nav { position: fixed; left: 50%; bottom: max(10px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 40; display: flex; gap: 4px; background: color-mix(in srgb, var(--bg2) 92%, transparent); backdrop-filter: blur(12px); border-radius: 22px; padding: 6px; box-shadow: 0 10px 30px rgba(20, 40, 90, .22); border: 1px solid var(--line); }
.nav button { position: relative; border: 0; background: transparent; border-radius: 16px; padding: 7px 12px; display: grid; justify-items: center; gap: 1px; font-size: 11px; font-weight: 800; color: var(--muted); min-width: 62px; }
.nav button span { font-size: 21px; }
.nav button.on { background: color-mix(in srgb, var(--pri) 14%, transparent); color: var(--pri); }
.nav .badge { top: 0; right: 6px; font-size: 10px; padding: 1px 6px; }

/* ---------- jogo compacto ---------- */
.barrajogo { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.barrajogo .voltar { border: 0; background: var(--bg2); border-radius: 12px; width: 40px; height: 40px; font-weight: 900; font-size: 18px; box-shadow: var(--sombra); flex: none; }
.barrajogo .tit { flex: 1; min-width: 0; font-weight: 900; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.barrajogo .chip { padding: 6px 10px; font-size: 13px; }
.tela.modojogo { padding-bottom: 12px; padding-top: 8px; }
.ajudas { display: flex; gap: 6px; justify-content: center; flex-wrap: nowrap; margin-top: 8px; }
.ajudas .btn { padding: 9px 12px; font-size: 14px; white-space: nowrap; }
.so-celular { display: none; }
.gaveta { position: fixed; inset: 0; z-index: 45; background: rgba(10, 20, 35, .45); display: flex; align-items: flex-end; animation: aparece .2s; }
.gaveta .folha { background: var(--bg2); width: 100%; max-height: 75vh; overflow: auto; border-radius: 22px 22px 0 0; padding: 14px 14px calc(14px + env(safe-area-inset-bottom)); animation: sobefolha .25s ease-out; }
@keyframes sobefolha { from { transform: translateY(40%); } }
.listas.lateral { position: sticky; top: 8px; max-height: calc(100vh - 24px); overflow: auto; }
.listas.lateral .lista { max-height: none; }

/* ---------- conta ---------- */
.formconta { background: var(--bg2); border-radius: var(--raio); box-shadow: var(--sombra); padding: 18px; display: grid; gap: 10px; max-width: 460px; margin: 0 auto; }
.formconta label { font-weight: 800; font-size: 14px; }
.formconta input { padding: 13px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--txt); font: inherit; font-size: 16px; }
.formconta .erro { color: var(--bad); font-weight: 800; min-height: 20px; }

/* ---------- janelas ---------- */
.modal { position: fixed; inset: 0; background: rgba(10, 20, 35, .55); backdrop-filter: blur(3px); display: grid; place-items: center; z-index: 50; padding: 16px; animation: aparece .2s; }
.janela { background: var(--bg2); border-radius: 24px; padding: 24px; width: min(560px, 100%); max-height: 88vh; overflow: auto; box-shadow: 0 20px 60px rgba(0, 0, 0, .35); animation: salta .35s cubic-bezier(.3, 1.5, .5, 1); }
@keyframes salta { from { transform: scale(.85); opacity: 0; } }
.janela h2 { margin: 0 0 6px; text-align: center; font-size: 30px; font-weight: 900; }
.estrelas { text-align: center; font-size: 46px; letter-spacing: 6px; margin: 4px 0 8px; }
.estrelas span { display: inline-block; animation: estrela .5s backwards cubic-bezier(.3, 1.8, .5, 1); }
@keyframes estrela { from { transform: scale(0) rotate(-90deg); } }
.premios { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 8px 0 14px; }
.aprendidas { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 10px; font-size: 14px; font-weight: 600; }
.aprendidas div { padding: 4px 0; }
.toasts { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 60; display: grid; gap: 8px; width: min(420px, 92vw); }
.toast { background: var(--txt); color: var(--bg2); padding: 12px 16px; border-radius: 14px; font-weight: 700; box-shadow: var(--sombra); animation: entra .25s; }
@keyframes entra { from { transform: translateY(12px); opacity: 0; } }
.flutua { position: fixed; pointer-events: none; font-weight: 900; color: var(--ok); z-index: 70; animation: sobe 1s forwards; text-shadow: 0 2px 0 var(--bg2); }
@keyframes sobe { to { transform: translateY(-40px); opacity: 0; } }
#confete { position: fixed; inset: 0; pointer-events: none; z-index: 55; }

@media (max-width: 900px) {
  .jogo { grid-template-columns: minmax(0, 1fr); }
  .jogo .listas { display: none; }
  .so-celular { display: inline-block; }
  .ajudas .txt { display: none; }
  .barrajogo .chip.opc { display: none; }
