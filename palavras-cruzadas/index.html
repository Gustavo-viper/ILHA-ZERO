<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6fd1">
<title>Cruzadas do Saber</title>
<meta name="description" content="Palavras cruzadas educativas com mais de mil palavras, campanha, desafio diário, missões e conquistas.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg">
<style>
:root {
  --bg: #eef3fb; --bg2: #ffffff; --txt: #1d2a3a; --muted: #66758a; --line: #d6dfeb;
  --pri: #2f6fd1; --pri2: #ffb02e; --ok: #22a06b; --bad: #e0483e;
  --cel: 38px; --celbg: #ffffff; --celsel: #ffe58a; --celword: #dbe9ff; --celok: #d6f5e6; --celrev: #f1e6ff; --vazia: transparent;
  --sombra: 0 6px 20px rgba(30, 60, 110, .12); --raio: 14px;
}
body.escuro {
  --bg: #0f1621; --bg2: #18222f; --txt: #e8eef6; --muted: #93a2b5; --line: #2a3747;
  --celbg: #1f2b3a; --celsel: #6b5a17; --celword: #23406b; --celok: #1d4a37; --celrev: #3d2c5a; --sombra: 0 6px 20px rgba(0, 0, 0, .35);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; overflow-x: hidden; background: var(--bg); color: var(--txt); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
button { font: inherit; cursor: pointer; color: inherit; }
.hidden { display: none !important; }
.tela { max-width: 1180px; margin: 0 auto; padding: 14px 14px 40px; }

/* ---------- topo ---------- */
.topo { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--bg2); border-radius: var(--raio); box-shadow: var(--sombra); margin-bottom: 14px; flex-wrap: wrap; }
.topo .voltar { border: 0; background: var(--bg); border-radius: 10px; padding: 8px 12px; font-weight: 700; }
.topo h2 { margin: 0; font-size: 19px; flex: 1; min-width: 140px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--bg); padding: 6px 11px; border-radius: 999px; font-weight: 700; font-size: 14px; white-space: nowrap; }
.nivelbox { display: flex; align-items: center; gap: 10px; min-width: 190px; }
.avatar { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, var(--pri), #6ea1f5); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 17px; flex: none; }
.xpbar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; width: 130px; margin-top: 4px; }
.xpbar i { display: block; height: 100%; background: var(--pri2); }

/* ---------- início ---------- */
.hero { text-align: center; padding: 22px 10px 10px; }
.hero h1 { font-size: clamp(30px, 6vw, 48px); margin: 0; letter-spacing: -.5px; }
.hero h1 span { color: var(--pri); }
.hero p { color: var(--muted); margin: 6px 0 0; }
.menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin-top: 18px; }
.card { background: var(--bg2); border-radius: var(--raio); box-shadow: var(--sombra); padding: 16px; border: 0; text-align: left; position: relative; transition: transform .12s; }
button.card:hover { transform: translateY(-2px); }
.card .ic { font-size: 28px; }
.card b { display: block; font-size: 17px; margin-top: 6px; }
.card small { color: var(--muted); display: block; margin-top: 3px; line-height: 1.35; }
.card.destaque { background: linear-gradient(135deg, var(--pri), #5a8ff0); color: #fff; }
.card.destaque small { color: #e2ecff; }
.badge { position: absolute; top: 10px; right: 12px; background: var(--bad); color: #fff; border-radius: 999px; font-size: 12px; font-weight: 800; padding: 2px 8px; }

/* ---------- mapa ---------- */
.mundos { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.mundo { background: var(--bg2); border-radius: var(--raio); box-shadow: var(--sombra); padding: 14px; border: 0; text-align: left; border-top: 5px solid var(--cor, var(--pri)); }
.mundo.trancado { opacity: .5; filter: grayscale(.7); }
.mundo .ic { font-size: 30px; }
.mundo b { display: block; margin-top: 4px; }
.prog { height: 7px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 8px; }
.prog i { display: block; height: 100%; background: var(--cor, var(--pri)); }
.niveis { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 12px; }
.nivel { aspect-ratio: 1; border-radius: 18px; border: 0; background: var(--bg2); box-shadow: var(--sombra); display: grid; place-items: center; align-content: center; gap: 2px; font-size: 26px; font-weight: 800; }
.nivel small { font-size: 14px; letter-spacing: 1px; }
.nivel.trancado { opacity: .45; }
.nivel.feito { background: var(--celok); }

/* ---------- jogo ---------- */
.jogo { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 14px; align-items: start; }
.painel { background: var(--bg2); border-radius: var(--raio); box-shadow: var(--sombra); padding: 12px; }
.dicaatual { display: flex; align-items: center; gap: 8px; background: var(--celword); border-radius: 12px; padding: 10px 10px; margin-bottom: 10px; min-height: 56px; }
.dicaatual .seta { border: 0; background: var(--bg2); border-radius: 9px; width: 34px; height: 34px; font-size: 18px; flex: none; }
.dicaatual .t { flex: 1; font-size: 16px; line-height: 1.3; }
.dicaatual .t b { color: var(--pri); }
.painel { min-width: 0; }
.gradebox { max-width: 100%; overflow: auto; display: flex; justify-content: center; padding: 4px; }
.grade { display: grid; gap: 2px; user-select: none; touch-action: manipulation; }
.c { width: var(--cel); height: var(--cel); position: relative; border-radius: 5px; background: var(--celbg); box-shadow: inset 0 0 0 1.5px var(--line); display: grid; place-items: center; font-weight: 800; font-size: calc(var(--cel) * .55); text-transform: uppercase; cursor: pointer; transition: background .12s; }
.c.v { background: var(--vazia); box-shadow: none; cursor: default; }
.c .n { position: absolute; top: 1px; left: 3px; font-size: calc(var(--cel) * .26); font-weight: 700; color: var(--muted); line-height: 1; }
.c.pal { background: var(--celword); }
.c.sel { background: var(--celsel); box-shadow: inset 0 0 0 2.5px var(--pri); }
.c.ok { background: var(--celok); color: var(--ok); }
.c.rev { color: #8a4fd6; }
.c.erro { color: var(--bad); animation: tremer .3s; }
.c.pulo { animation: pulo .45s; }
@keyframes pulo { 40% { transform: scale(1.18); } }
@keyframes tremer { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.acoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; justify-content: center; }
.btn { border: 0; border-radius: 11px; padding: 10px 14px; font-weight: 700; background: var(--bg); }
.btn.pri { background: var(--pri); color: #fff; }
.btn.amar { background: var(--pri2); color: #2a1a00; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.listas h3 { margin: 4px 4px 6px; font-size: 15px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.lista { list-style: none; margin: 0 0 12px; padding: 0; max-height: 34vh; overflow: auto; }
.lista li { padding: 7px 8px; border-radius: 9px; cursor: pointer; font-size: 14.5px; line-height: 1.3; display: flex; gap: 8px; }
.lista li b { min-width: 24px; color: var(--pri); }
.lista li.atual { background: var(--celword); }
.lista li.feita { color: var(--muted); text-decoration: line-through; }
.teclado { margin-top: 10px; display: grid; gap: 6px; }
.teclado .linha { display: flex; gap: 5px; justify-content: center; }
.teclado button { flex: 1; max-width: 46px; height: 46px; border: 0; border-radius: 9px; background: var(--bg); font-weight: 800; font-size: 17px; box-shadow: 0 2px 0 var(--line); }
.teclado button.larga { max-width: 80px; flex: 1.6; }

/* ---------- listas / páginas ---------- */
.item { display: flex; align-items: center; gap: 12px; background: var(--bg2); border-radius: var(--raio); box-shadow: var(--sombra); padding: 12px 14px; margin-bottom: 10px; }
.item .ic { font-size: 28px; width: 40px; text-align: center; flex: none; }
.item .tx { flex: 1; }
.item .tx small { color: var(--muted); display: block; }
.item.bloq { opacity: .55; filter: grayscale(.8); }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.stat { background: var(--bg2); border-radius: var(--raio); box-shadow: var(--sombra); padding: 14px; }
.stat b { font-size: 26px; display: block; }
.stat small { color: var(--muted); }
.dic h3 { display: flex; justify-content: space-between; margin: 18px 4px 8px; }
.dic .pal { background: var(--bg2); border-radius: 10px; padding: 9px 12px; margin-bottom: 6px; box-shadow: var(--sombra); }
.dic .pal b { color: var(--pri); }
.busca { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg2); color: var(--txt); font-size: 16px; }
.opcao { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px; background: var(--bg2); border-radius: var(--raio); box-shadow: var(--sombra); margin-bottom: 10px; }
.opcao select { padding: 8px; border-radius: 9px; font: inherit; background: var(--bg); color: var(--txt); border: 1px solid var(--line); }
.tamanhos { display: flex; gap: 8px; margin: 10px 0 16px; flex-wrap: wrap; }
.tamanhos .btn.on { background: var(--pri); color: #fff; }

/* ---------- janelas ---------- */
.modal { position: fixed; inset: 0; background: rgba(10, 20, 35, .55); display: grid; place-items: center; z-index: 50; padding: 16px; }
.janela { background: var(--bg2); border-radius: 18px; padding: 22px; width: min(560px, 100%); max-height: 88vh; overflow: auto; box-shadow: 0 20px 60px rgba(0, 0, 0, .35); }
.janela h2 { margin: 0 0 6px; text-align: center; font-size: 28px; }
.estrelas { text-align: center; font-size: 42px; letter-spacing: 6px; margin: 4px 0 8px; }
.premios { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 8px 0 14px; }
.aprendidas { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 10px; font-size: 14px; }
.aprendidas div { padding: 4px 0; }
.toasts { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 60; display: grid; gap: 8px; width: min(420px, 92vw); }
.toast { background: var(--txt); color: var(--bg2); padding: 12px 16px; border-radius: 12px; font-weight: 600; box-shadow: var(--sombra); animation: entra .25s; }
@keyframes entra { from { transform: translateY(12px); opacity: 0; } }
.flutua { position: fixed; pointer-events: none; font-weight: 800; color: var(--ok); z-index: 70; animation: sobe 1s forwards; }
@keyframes sobe { to { transform: translateY(-40px); opacity: 0; } }

@media (max-width: 900px) {
  .jogo { grid-template-columns: minmax(0, 1fr); }
  .dicaatual { position: sticky; top: 4px; z-index: 5; box-shadow: var(--sombra); }
  .teclado { position: sticky; bottom: 0; background: var(--bg2); padding: 6px 0 calc(6px + env(safe-area-inset-bottom)); z-index: 5; }
  .lista { max-height: none; }
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toasts" id="toasts"></div>
<script src="js/palavras.js"></script>
<script src="js/gerador.js"></script>
<script src="js/jogo.js"></script>
</body>
</html>
